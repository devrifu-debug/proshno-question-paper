<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>MCQ</title>
<meta name="description" content="Check MCQ answer sheets with your phone camera.">
<meta name="theme-color" content="#101219">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MCQ">
<link rel="manifest" href="manifest.webmanifest">
<script src="../auth-config.js"></script>
<script>window.PROSHNO_AUTH_MODE = "guard"; window.PROSHNO_AUTH_BASE = "../";
/* ---------------- sign-in (only when the app is served by server.mjs) ----------------
   server.mjs serves auth-config.js with its public key. Without it (a plain static copy, the preview) the app stays open.
   Anyone can make an account; it works for the free days, then the app stays locked until the admin approves it.
   The phone keeps a signed pass, so the app also works offline — but never past the end of the person's access. */
(function () {
  const CFG = window.PROSHNO_AUTH; if (!CFG || !CFG.key) return;
  const BASE = window.PROSHNO_AUTH_BASE || '';
  const GUARD = window.PROSHNO_AUTH_MODE === 'guard';   // the MCQ test page: no screens of its own, sends people to the app
  const LS = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} },
    del(k) { try { localStorage.removeItem(k); } catch (e) {} },
  };
  const K = 'proshno-auth', KD = 'proshno-device';
  const device = () => { let d = LS.get(KD, ''); if (!d) { d = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36)); LS.set(KD, d); } return d; };
  const bytes = s => { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); };
  let key = null;
  // the pass payload if it is genuine and was given to this phone (expired or not)
  async function read() {
    const a = LS.get(K, null); if (!a || !a.token || !crypto.subtle) return null;
    try {
      const [body, sig] = a.token.split('.');
      key = key || await crypto.subtle.importKey('jwk', CFG.key, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
      if (!await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, key, bytes(sig), new TextEncoder().encode(body))) return null;
      const p = JSON.parse(new TextDecoder().decode(bytes(body)));
      return p.d === device() ? p : null;
    } catch (e) { return null; }
  }
  const valid = p => !!p && p.exp > Date.now();

  if (GUARD) {
    if (window.parent !== window) return;   // inside the app: the app's own sign-in screen covers it
    const go = async () => { if (!valid(await read())) location.replace(BASE || '../'); };
    go(); setInterval(go, 30000); document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && go());
    return;
  }

  /* ---------- texts ---------- */
  const HAS_I18N = typeof I18N !== 'undefined';
  const lang = () => (HAS_I18N ? I18N.lang : 'bn');
  const T = (bn, en) => lang() === 'en' ? en : bn;
  const N = s => lang() === 'en' ? String(s) : String(s).replace(/[0-9]/g, d => '০১২৩৪৫৬৭৮৯'[d]);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const DAYS = CFG.trialDays || 2;
  function left(ms) {
    ms = Math.max(0, ms); const d = Math.floor(ms / 864e5), h = Math.floor(ms % 864e5 / 36e5), m = Math.max(1, Math.floor(ms % 36e5 / 6e4));
    if (d) return T(`${N(d)} দিন ${N(h)} ঘণ্টা`, `${d} day${d > 1 ? 's' : ''} ${h} h`);
    if (h) return T(`${N(h)} ঘণ্টা ${N(m)} মিনিট`, `${h} h ${m} min`);
    return T(`${N(m)} মিনিট`, `${m} min`);
  }
  const ERR = {
    wrong: () => T('ইমেইল বা পাসওয়ার্ড ভুল।', 'Wrong email or password.'),
    bad_request: () => T('সব ঘর পূরণ করুন।', 'Please fill in every box.'),
    bad_phone: () => T('সঠিক মোবাইল নম্বর দিন (যেমন ০১৭XXXXXXXX)।', 'Enter a valid mobile number (like 017XXXXXXXX).'),
    bad_email: () => T('সঠিক ইমেইল দিন।', 'Enter a valid email.'),
    short_password: () => T('পাসওয়ার্ড কমপক্ষে ৬ অক্ষরের হতে হবে।', 'The password needs at least 6 characters.'),
    exists: () => T('এই ইমেইলে আগেই অ্যাকাউন্ট আছে। সাইন ইন করুন।', 'This email already has an account. Sign in instead.'),
    phone_exists: () => T('এই মোবাইল নম্বরে আগেই অ্যাকাউন্ট আছে। সাইন ইন করুন।', 'This mobile number already has an account. Sign in instead.'),
    too_many: () => T('অনেকবার চেষ্টা হয়েছে। ১৫ মিনিট পরে আবার চেষ্টা করুন।', 'Too many tries. Please try again in 15 minutes.'),
    devices: () => T('এই অ্যাকাউন্ট আগেই ২টি ফোনে চালু আছে। নতুন ফোনে চালাতে অ্যাডমিনের সাথে যোগাযোগ করুন।', 'This account is already used on 2 phones. Contact the admin to use it on a new phone.'),
    signed_out: () => T('আবার সাইন ইন করুন।', 'Please sign in again.'),
    offline: () => T('ইন্টারনেট নেই। সাইন ইন করতে ইন্টারনেট চালু করুন।', 'You are offline. Connect to the internet to sign in.'),
    network: () => T('সার্ভারে পৌঁছানো যায়নি। ইন্টারনেট দেখে আবার চেষ্টা করুন।', 'Could not reach the server. Check your internet and try again.'),
  };
  const LOCK = {
    trial_over: [() => T(`আপনার ${N(DAYS)} দিনের ফ্রি সময় শেষ`, `Your ${DAYS}-day free time is over`), () => T('অ্যাপটি আবার ব্যবহার করতে অ্যাডমিনের অনুমতি লাগবে। অনুমতি পেলে নিচের বোতাম চাপুন।', 'You need the admin’s permission to keep using the app. Once you have it, tap the button below.')],
    trial_used: [() => T('এই ফোনে আগেই ফ্রি সময় নেওয়া হয়েছে', 'This phone has already used its free time'), () => T('আপনার অ্যাকাউন্ট তৈরি হয়েছে। অ্যাপ ব্যবহার করতে অ্যাডমিনের অনুমতি লাগবে। অনুমতি পেলে নিচের বোতাম চাপুন।', 'Your account is made. You need the admin’s permission to use the app. Once you have it, tap the button below.')],
    expired: [() => T('আপনার অনুমতির মেয়াদ শেষ', 'Your access has ended'), () => T('আবার চালু করতে অ্যাডমিনের সাথে যোগাযোগ করুন। অনুমতি পেলে নিচের বোতাম চাপুন।', 'Contact the admin to renew. Once renewed, tap the button below.')],
    disabled: [() => T('এই অ্যাকাউন্টটি বন্ধ আছে', 'This account is switched off'), () => T('বিস্তারিত জানতে অ্যাডমিনের সাথে যোগাযোগ করুন।', 'Contact the admin for details.')],
  };

  /* ---------- state ---------- */
  const S = { view: 'loading', msg: '', busy: false, code: '', name: '', contact: CFG.contact || '', email: LS.get('proshno-last-email', ''), pass: null };
  const post = async (route, body) => {
    const r = await fetch(BASE + 'api/' + route, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store' });
    const d = await r.json().catch(() => ({})); return Object.assign(d, { ok: r.ok, status: r.status });
  };
  const devName = () => { const u = navigator.userAgent; return /iphone/i.test(u) ? 'iPhone' : /ipad/i.test(u) ? 'iPad' : /android/i.test(u) ? 'Android phone' : /mac/i.test(u) ? 'Mac' : /windows/i.test(u) ? 'Windows computer' : 'Computer'; };
  function save(d) { LS.set(K, { token: d.token }); LS.set('proshno-auth-at', Date.now()); if (d.email) LS.set('proshno-last-email', d.email); }
  async function unlock() {
    S.pass = await read(); S.view = 'in'; S.msg = '';
    document.documentElement.classList.remove('authwait'); draw();
  }
  function lock(code, extra) {
    S.view = 'locked'; S.code = LOCK[code] ? code : 'trial_over'; S.busy = false;
    if (extra && extra.contact) S.contact = extra.contact;
    if (extra && extra.name) S.name = extra.name;
    draw();
  }
  function signin(msg) { S.view = 'signin'; S.msg = msg || ''; S.busy = false; draw(); }
  // ask the server for a fresh pass (needs internet)
  async function renew(force) {
    if (navigator.onLine === false || !LS.get(K, null)) return;
    if (!force && S.view === 'in' && Date.now() - LS.get('proshno-auth-at', 0) < 6 * 36e5) return;
    let d; try { d = await post('refresh', { token: LS.get(K, {}).token }); } catch (e) { return; }
    if (d.ok) { save(d); if (S.view !== 'in') await unlock(); else { S.pass = await read(); draw(); } return; }
    if (d.status === 401 && LOCK[d.error]) return lock(d.error, d);
    if (d.status === 401) { LS.del(K); signin(ERR.signed_out()); }
  }
  // every so often while the app is open: lock it the moment the pass runs out
  async function tick() {
    if (S.view !== 'in') return;
    const p = await read();
    if (valid(p)) { S.pass = p; draw(); return renew(false); }
    if (p && p.end && p.end <= Date.now()) { lock(p.t ? 'trial_over' : 'expired', { name: p.n }); return renew(true); }
    if (navigator.onLine === false) { LS.del(K); return signin(T('অনেক দিন অফলাইন ছিলেন। ইন্টারনেট চালু করে আবার সাইন ইন করুন।', 'You have been offline too long. Connect to the internet and sign in again.')); }
    renew(true);
  }

  /* ---------- screens ---------- */
  const LSW = '<div class="langsw" role="group" aria-label="ভাষা / Language"><button type="button" data-lang="bn">বাং</button><button type="button" data-lang="en">EN</button></div>';
  const eye = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const pw = (id, ac) => `<div class="g-pw"><input id="${id}" type="password" autocomplete="${ac}" required minlength="6"><button type="button" class="g-eye" data-g="eye" aria-label="${T('পাসওয়ার্ড দেখুন', 'Show password')}">${eye}</button></div>`;
  function contactBox() {
    const c = S.contact; if (!c) return '';
    const m = c.replace(/[০-৯]/g, d => '০১২৩৪৫৬৭৮৯'.indexOf(d)).match(/(\+?88)?01[3-9]\d{8}/);
    const wa = m ? 'https://wa.me/88' + m[0].replace(/^\+?88/, '') : '';
    return `<div class="g-contact"><span>${T('যোগাযোগ', 'Contact')}: <b>${esc(c)}</b></span>${wa ? `<a class="g-btn g-wa" href="${wa}" target="_blank" rel="noopener">WhatsApp</a><a class="g-btn" href="tel:${m[0]}">${T('কল করুন', 'Call')}</a>` : ''}</div>`;
  }
  function screen() {
    const msg = S.msg ? `<div class="g-msg" role="alert">${esc(S.msg)}</div>` : '';
    if (S.view === 'loading') return `<div class="g-load"><span class="g-spin"></span></div>`;
    if (S.view === 'signup') return `<h2>${T('নতুন অ্যাকাউন্ট', 'Create an account')}</h2>
      <p class="g-sub">${T(`অ্যাকাউন্ট খুললেই <b>${N(DAYS)} দিন ফ্রি</b> ব্যবহার করতে পারবেন।`, `Your first <b>${DAYS} days are free</b>.`)}</p>
      <form id="gUp" novalidate>
        <label for="gName">${T('আপনার নাম', 'Your name')}</label><input id="gName" autocomplete="name" required maxlength="80">
        <label for="gPhone">${T('মোবাইল নম্বর', 'Mobile number')}</label><input id="gPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX" required>
        <label for="gEmail">${T('ইমেইল', 'Email')}</label><input id="gEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" required>
        <label for="gPw">${T('পাসওয়ার্ড (কমপক্ষে ৬ অক্ষর)', 'Password (at least 6 characters)')}</label>${pw('gPw', 'new-password')}
        ${msg}<button class="g-main" ${S.busy ? 'disabled' : ''}>${S.busy ? '<span class="g-spin"></span>' : ''}${T(`অ্যাকাউন্ট খুলুন — ${N(DAYS)} দিন ফ্রি`, `Create account — ${DAYS} days free`)}</button>
      </form>
      <p class="g-alt">${T('আগে অ্যাকাউন্ট খুলেছেন?', 'Already have an account?')} <button type="button" data-g="signin">${T('সাইন ইন', 'Sign in')}</button></p>`;
    if (S.view === 'locked') { const [h, p] = LOCK[S.code]; return `<div class="g-lock">⏳</div><h2>${h()}</h2>
      ${S.name ? `<p class="g-sub" style="margin-bottom:4px">${esc(S.name)}</p>` : ''}<p class="g-sub">${p()}</p>${contactBox()}${msg}
      <button class="g-main" data-g="recheck" ${S.busy ? 'disabled' : ''}>${S.busy ? '<span class="g-spin"></span>' : ''}${T('অনুমতি পেয়েছি — আবার চেক করুন', 'I have permission — check again')}</button>
      <p class="g-alt"><button type="button" data-g="signout">${T('অন্য অ্যাকাউন্টে সাইন ইন', 'Sign in with another account')}</button></p>`; }
    return `<h2>${T('সাইন ইন', 'Sign in')}</h2><p class="g-sub">${T('প্রশ্নপত্র তৈরি ও এমসিকিউ পরীক্ষা — আপনার অ্যাকাউন্ট দিয়ে।', 'Question papers and MCQ tests — with your account.')}</p>
      <form id="gIn" novalidate>
        <label for="gEmail">${T('ইমেইল', 'Email')}</label><input id="gEmail" type="email" inputmode="email" autocomplete="username" autocapitalize="off" spellcheck="false" required value="${esc(S.email)}">
        <label for="gPw">${T('পাসওয়ার্ড', 'Password')}</label>${pw('gPw', 'current-password')}
        ${msg}<button class="g-main" ${S.busy ? 'disabled' : ''}>${S.busy ? '<span class="g-spin"></span>' : ''}${T('সাইন ইন', 'Sign in')}</button>
      </form>
      <div class="g-or"><span>${T('নতুন?', 'New here?')}</span></div>
      <button type="button" class="g-second" data-g="signup">${T(`নতুন অ্যাকাউন্ট খুলুন — ${N(DAYS)} দিন ফ্রি`, `Create an account — ${DAYS} days free`)}</button>`;
  }
  let gate = null, pill = null;
  function draw() {
    if (!gate) { gate = document.createElement('div'); gate.id = 'gate'; gate.setAttribute('data-noi18n', ''); document.body.appendChild(gate); }
    if (S.view === 'in') { gate.hidden = true; gate.innerHTML = ''; drawPill(); return; }
    const keep = {}; gate.querySelectorAll('input[id]').forEach(i => { if (i.type !== 'password') keep[i.id] = i.value; });
    gate.hidden = false;
    gate.innerHTML = `<div class="g-card"><div class="g-head"><span class="g-logo">প্রশ্ন</span>${LSW}</div>${screen()}</div>`;
    Object.keys(keep).forEach(id => { const i = gate.querySelector('#' + id); if (i && keep[id]) i.value = keep[id]; });
    gate.querySelectorAll('.langsw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang()));
    if (pill) pill.hidden = true;
  }
  function drawPill() {
    const home = document.getElementById('homeView'); if (!home) return;
    if (!pill) { pill = document.createElement('div'); pill.className = 'acct'; pill.setAttribute('data-noi18n', ''); home.appendChild(pill); }
    const p = S.pass; if (!p) { pill.hidden = true; return; }
    const until = p.t ? `<span class="acct-t">${T('ফ্রি', 'Free')}: ${T('আর', '')} ${left(p.end - Date.now())}${T('', ' left')}</span>` : p.end ? `<span class="acct-t ok">${T('মেয়াদ', 'Until')}: ${new Date(p.end).toLocaleDateString(lang() === 'en' ? 'en-GB' : 'bn-BD', { day: 'numeric', month: 'short', year: 'numeric' })}</span>` : '';
    pill.hidden = false;
    pill.innerHTML = `<span class="acct-n">${esc(p.n || p.e)}</span>${until}<button type="button" data-g="signout">${T('সাইন আউট', 'Sign out')}</button>`;
  }

  /* ---------- actions ---------- */
  async function submit(kind) {
    if (navigator.onLine === false) { S.msg = ERR.offline(); return draw(); }
    const v = id => (gate.querySelector('#' + id) || {}).value || '';
    const body = { email: v('gEmail').trim(), password: v('gPw'), device: device(), deviceName: devName() };
    if (kind === 'signup') { body.name = v('gName').trim(); body.phone = v('gPhone').trim(); if (!body.name || !body.phone || !body.email || !body.password) { S.msg = ERR.bad_request(); return draw(); } }
    else if (!body.email || !body.password) { S.msg = ERR.bad_request(); return draw(); }
    S.email = body.email; S.busy = true; S.msg = ''; draw();
    let d; try { d = await post(kind === 'signup' ? 'signup' : 'login', body); } catch (e) { d = { error: 'network' }; }
    S.busy = false;
    if (d.ok) { save(d); return unlock(); }
    if (LOCK[d.error]) { LS.set('proshno-last-email', body.email); return lock(d.error, d); }
    S.msg = (ERR[d.error] || ERR.network)(); draw();
    setTimeout(() => { const i = gate.querySelector(d.error === 'wrong' ? '#gPw' : 'input'); i && i.focus(); }, 30);
  }
  document.addEventListener('submit', e => { if (e.target.id === 'gIn' || e.target.id === 'gUp') { e.preventDefault(); submit(e.target.id === 'gUp' ? 'signup' : 'signin'); } });
  document.addEventListener('click', async e => {
    const b = e.target.closest('[data-g]'); if (!b) return;
    const a = b.dataset.g;
    if (a === 'signin') return signin();
    if (a === 'signup') { S.view = 'signup'; S.msg = ''; return draw(); }
    if (a === 'eye') { const i = b.previousElementSibling; i.type = i.type === 'password' ? 'text' : 'password'; return; }
    if (a === 'signout') { LS.del(K); S.pass = null; S.name = ''; document.documentElement.classList.add('authwait'); return signin(); }
    if (a === 'recheck') {
      if (!LS.get(K, null)) return signin(T('অনুমতি পেয়ে থাকলে সাইন ইন করুন।', 'If you have permission now, sign in.'));
      if (navigator.onLine === false) { S.msg = ERR.offline(); return draw(); }
      S.busy = true; S.msg = ''; draw(); await renew(true);
      if (S.view === 'locked') { S.busy = false; S.msg = T('এখনও অনুমতি দেওয়া হয়নি।', 'Not approved yet.'); draw(); }
    }
  });
  if (HAS_I18N) I18N.onChange(() => draw());
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') tick(); });
  window.addEventListener('online', () => renew(true));
  setInterval(tick, 30000);

  /* ---------- start ---------- */
  draw();
  (async () => {
    const p = await read();
    if (valid(p)) { await unlock(); renew(true); return; }
    if (p && p.end && p.end <= Date.now()) { lock(p.t ? 'trial_over' : 'expired', { name: p.n }); renew(true); return; }
    if (p) { if (navigator.onLine !== false) { await renew(true); if (S.view !== 'loading') return; } LS.del(K); }
    signin();
  })();
})();

</script>
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{
  --top:#FFD3E6; --bot:#FCE4F0; --bg:#FFF4F9; --blob1:#FFB3D3; --blob2:#FFE0EE; --blob3:#FFC2DD; --blob4:#F7D0E6;
  --glass:rgba(255,255,255,.56); --glass-2:rgba(255,255,255,.78); --glass-3:rgba(255,255,255,.34);
  --stroke:rgba(255,255,255,.75); --stroke-2:rgba(20,30,70,.08);
  --hi:inset 0 1px 0 rgba(255,255,255,.9), inset 0 -1px 0 rgba(255,255,255,.2);
  --shadow:0 10px 30px -8px rgba(28,40,96,.22), 0 2px 6px rgba(28,40,96,.06);
  --ink:#0B1222; --ink-2:#4A5470; --ink-3:#8790A8;
  --primary:#E5006E; --primary-2:#FF2E8A; --on-primary:#FFFFFF; --primary-soft:rgba(229,0,110,.12);
  --ok:#14924A; --ok-soft:rgba(20,146,74,.14); --bad:#DC3B41; --bad-soft:rgba(220,59,65,.13);
  --warn:#C26A00; --warn-soft:rgba(245,158,11,.2); --mute:#6B7590; --mute-soft:rgba(107,117,144,.14);
  --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --top:#4A0F2C; --bot:#2A0B1E; --bg:#12060C; --blob1:#6E1440; --blob2:#3B0D26; --blob3:#5B1D4A; --blob4:#401033;
    --glass:rgba(28,36,58,.55); --glass-2:rgba(36,46,72,.8); --glass-3:rgba(28,36,58,.35);
    --stroke:rgba(255,255,255,.13); --stroke-2:rgba(255,255,255,.07);
    --hi:inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(255,255,255,.03);
    --shadow:0 12px 34px -8px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
    --ink:#EEF2FC; --ink-2:#A9B2CB; --ink-3:#6E7894;
    --primary:#FF3D93; --primary-2:#FF6FAE; --on-primary:#2A0015; --primary-soft:rgba(255,61,147,.18);
    --ok:#4CD684; --ok-soft:rgba(76,214,132,.16); --bad:#FF7A7E; --bad-soft:rgba(255,122,126,.16);
    --warn:#FFB547; --warn-soft:rgba(255,181,71,.18); --mute:#98A2BC; --mute-soft:rgba(152,162,188,.14);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --top:#4A0F2C; --bot:#2A0B1E; --bg:#12060C; --blob1:#6E1440; --blob2:#3B0D26; --blob3:#5B1D4A; --blob4:#401033;
  --glass:rgba(28,36,58,.55); --glass-2:rgba(36,46,72,.8); --glass-3:rgba(28,36,58,.35);
  --stroke:rgba(255,255,255,.13); --stroke-2:rgba(255,255,255,.07);
  --hi:inset 0 1px 0 rgba(255,255,255,.14), inset 0 -1px 0 rgba(255,255,255,.03);
  --shadow:0 12px 34px -8px rgba(0,0,0,.6), 0 2px 6px rgba(0,0,0,.3);
  --ink:#EEF2FC; --ink-2:#A9B2CB; --ink-3:#6E7894;
  --primary:#FF3D93; --primary-2:#FF6FAE; --on-primary:#2A0015; --primary-soft:rgba(255,61,147,.18);
  --ok:#4CD684; --ok-soft:rgba(76,214,132,.16); --bad:#FF7A7E; --bad-soft:rgba(255,122,126,.16);
  --warn:#FFB547; --warn-soft:rgba(255,181,71,.18); --mute:#98A2BC; --mute-soft:rgba(152,162,188,.14);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* the browser paints its own bars (status bar, Safari 26 toolbars, Android address bar) from the page colour
   and theme-color: both are --top, the colour the backdrop starts from, so the page runs edge to edge */
html,body{min-height:100%}
html{background:var(--top)}
body{margin:0;touch-action:manipulation;-webkit-text-size-adjust:100%;color:var(--ink);font:16px/1.45 var(--f);-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
/* the liquid backdrop: soft colour fields that the glass refracts */
.backdrop{position:fixed;left:0;right:0;top:0;height:100vh;height:100lvh;z-index:-1;overflow:hidden;background:linear-gradient(180deg,var(--top),var(--bg) 38%,var(--bg) 72%,var(--bot))}   /* lvh: full screen, behind the toolbars too */
/* Safari 26 colours its top and bottom bars from fixed strips touching those edges: one per edge, in the
   colour the backdrop fades to there, so each bar blends into the page */
.edge{position:fixed;left:0;right:0;height:4px;z-index:-1;pointer-events:none}
.edge.top{top:0;background:var(--top)}.edge.bot{bottom:0;background:var(--bot)}
.backdrop i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75}
.backdrop i:nth-child(1){width:70vmax;height:70vmax;left:-25vmax;top:-20vmax;background:var(--blob1)}
.backdrop i:nth-child(2){width:55vmax;height:55vmax;right:-22vmax;top:18vh;background:var(--blob2)}
.backdrop i:nth-child(3){width:50vmax;height:50vmax;left:-10vmax;bottom:-22vmax;background:var(--blob3)}
.backdrop i:nth-child(4){width:40vmax;height:40vmax;right:-8vmax;bottom:-8vmax;background:var(--blob4);opacity:.55}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:12px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.sm{width:18px;height:18px}.ic.lg{width:30px;height:30px}
.muted{color:var(--ink-2)}.faint{color:var(--ink-3)}

/* phone column */
.app{max-width:480px;margin:0 auto;padding-inline:16px;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 120px);min-height:100vh}

/* glass */
.glass{background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--hi),var(--shadow);border-radius:26px;-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:var(--glass-2)}}
.card{padding:18px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}

/* top bar */
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px;margin-bottom:4px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.iconbtn.glass{border-radius:50%}
.title{font-size:34px;font-weight:750;letter-spacing:-.025em;line-height:1.1;margin:6px 4px 18px;text-wrap:balance}
.title small{display:block;font-size:15px;font-weight:500;letter-spacing:0;color:var(--ink-2);margin-top:6px}
.sub{font-size:13px;font-weight:650;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);margin:22px 6px 10px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:999px;font-weight:650;font-size:16px;color:var(--ink);background:var(--glass);border:1px solid var(--stroke);box-shadow:var(--hi);-webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.primary{color:var(--on-primary);background:linear-gradient(180deg,var(--primary-2),var(--primary));border-color:transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 10px 24px -8px color-mix(in srgb,var(--primary) 70%,transparent)}
.btn.danger{color:var(--bad)}
.btn.block{width:100%}
.btn.sm{min-height:38px;padding:0 14px;font-size:14.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{color:var(--primary);font-weight:650;font-size:15px;padding:8px 4px}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:30;width:min(448px,calc(100% - 32px))}
.fab .btn{width:100%;min-height:58px;font-size:17px}

/* exam list */
.exam{display:block;width:100%;text-align:left;padding:6px}
.exam-main{display:block;width:100%;text-align:left;padding:12px 12px 8px;border-radius:22px}
.exam-main:active{background:var(--glass-3)}
.exam-main .ic{color:var(--ink-3);margin-top:3px}
.exam-acts{display:flex;gap:8px;padding:4px 6px 6px}
.exam-acts .btn{flex:1;min-height:46px;font-size:15px}
.btn.soft{background:var(--primary-soft);color:var(--primary);border-color:transparent;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.how{list-style:none;margin:18px 0 4px;padding:0;display:flex;flex-direction:column;gap:14px;text-align:left}
.how li{display:flex;gap:14px;align-items:flex-start}
.how .n{width:32px;height:32px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:750;color:var(--on-primary);background:var(--primary)}
.how b{display:block;font-size:16px}
.how li span:not(.n){font-size:14px;color:var(--ink-2)}
.exam h3{font-size:18px;font-weight:700;letter-spacing:-.01em}
.exam .meta{font-size:14px;color:var(--ink-2);margin-top:4px}
.exam .foot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;gap:8px}
.big-num{font-size:26px;font-weight:750;letter-spacing:-.02em}
.tag{font-size:11px;font-weight:750;letter-spacing:.07em;text-transform:uppercase;color:var(--primary);background:var(--primary-soft);padding:3px 8px;border-radius:999px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:650;padding:5px 11px;border-radius:999px;background:var(--mute-soft);color:var(--mute);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:currentColor}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.info{background:var(--primary-soft);color:var(--primary)}

/* segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:4px;border-radius:999px;gap:4px;margin-bottom:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 8px);z-index:20}
.seg button{min-height:42px;border-radius:999px;font-weight:650;font-size:15px;color:var(--ink-2);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{background:var(--glass-2);color:var(--ink);box-shadow:var(--hi),0 2px 10px rgba(20,30,70,.12)}
.seg .dot{min-width:20px;height:20px;border-radius:999px;background:var(--warn);color:#fff;font-size:12px;display:grid;place-items:center;padding:0 5px}

/* scan hero */
.hero{padding:26px 18px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px}
.shutter-big{position:relative;width:132px;height:132px;border-radius:50%;display:grid;place-items:center;color:var(--on-primary);background:radial-gradient(circle at 35% 30%,var(--primary-2),var(--primary) 70%);box-shadow:inset 0 2px 0 rgba(255,255,255,.4),0 18px 40px -10px color-mix(in srgb,var(--primary) 75%,transparent);margin:6px 0 8px}
.shutter-big::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:2px solid color-mix(in srgb,var(--primary) 45%,transparent);animation:pulse 2.4s ease-out infinite}
.shutter-big .ic{width:48px;height:48px}
@keyframes pulse{0%{transform:scale(.92);opacity:.9}100%{transform:scale(1.18);opacity:0}}
.hero h2{font-size:22px;font-weight:750;letter-spacing:-.01em}
.hero p{color:var(--ink-2);font-size:15px;max-width:30ch}

/* lists */
.list{display:flex;flex-direction:column;overflow:hidden;padding:4px}
.li{display:flex;align-items:center;gap:12px;padding:12px;border-radius:20px;text-align:left;width:100%}
.li+.li{border-top:1px solid var(--stroke-2);border-radius:0}
.li:active{background:var(--glass-3)}
.li .thumb{width:44px;height:56px;border-radius:10px;overflow:hidden;background:var(--glass-3);flex:none;display:grid;place-items:center;color:var(--ink-3)}
.li .thumb img{width:100%;height:100%;object-fit:cover}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13.5px;color:var(--ink-2);margin-top:1px}
.score-pill{min-width:62px;text-align:center;font-weight:750;font-size:15px;padding:7px 10px;border-radius:999px}
.list.compact .li{padding:7px 10px;gap:10px}
.list.compact .li .thumb{width:30px;height:38px;border-radius:7px}
.list.compact .li .t{font-size:15px}
.list.compact .li .s{font-size:13px;margin-top:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list.compact .score-pill{min-width:54px;font-size:14px;padding:4px 8px}
.bar-p{height:5px;border-radius:9px;background:var(--glass-3);overflow:hidden;margin-top:7px}
.bar-p i{display:block;height:100%;background:var(--primary);border-radius:9px;transition:width .25s}
.err{font-size:13.5px;color:var(--bad);margin-top:2px}

/* key grid */
.keys{display:flex;flex-direction:column;gap:2px;padding:8px}
.krow{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:16px}
.krow.flag{background:var(--warn-soft)}
.krow .n{width:30px;text-align:right;font:600 14px var(--mono);color:var(--ink-2);margin-right:4px}
.ob{flex:1;max-width:52px;aspect-ratio:1;border-radius:50%;border:1.8px solid color-mix(in srgb,var(--ink) 22%,transparent);font-weight:700;font-size:15px;color:var(--ink-2);display:grid;place-items:center;background:var(--glass-3)}
.ob[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.krow.flag .ob.cand{border-color:var(--warn);color:var(--warn)}
.key-sum{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px}
.ks{display:flex;align-items:center;justify-content:space-between;padding:6px 8px;border-radius:12px;background:var(--glass-3);font-size:13px}
.ks b{width:24px;height:24px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:12.5px}
.paste{display:flex;gap:8px;padding:12px}

/* inputs */
.field{display:flex;flex-direction:column;gap:6px;padding:12px 16px}
.field+.field{border-top:1px solid var(--stroke-2)}
.field label,.flabel{font-size:13.5px;font-weight:650;color:var(--ink-2)}
.input{width:100%;min-height:48px;border-radius:14px;border:1px solid var(--stroke-2);background:var(--glass-3);padding:10px 14px;font-size:17px}
.pwbox{position:relative}.pwbox .input{padding-right:52px}.pweye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:44px;display:grid;place-items:center;border:0;background:none;color:var(--ink-2);border-radius:12px}.pweye .ic{width:22px;height:22px}
.input:focus{outline:2px solid color-mix(in srgb,var(--primary) 55%,transparent)}
.input.bad{border-color:var(--bad)}
.hint{font-size:12.5px;color:var(--ink-3)}
.errtxt{font-size:13px;color:var(--bad);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-width:56px;height:46px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:17px;background:var(--glass-2);border:1px solid var(--stroke);box-shadow:var(--hi);color:var(--ink);transition:background .15s,color .15s,transform .12s}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:transparent}
.chips+.stepper{margin-top:10px}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.stepper input{-moz-appearance:textfield;appearance:textfield}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:46px;height:46px;border-radius:50%;background:var(--glass-2);box-shadow:var(--hi);font-size:24px;font-weight:500;display:grid;place-items:center}
.stepper input{text-align:center;font-weight:700;font-size:20px;max-width:90px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;font-weight:600}
.toggle input{appearance:none;width:52px;height:32px;border-radius:99px;background:var(--mute-soft);position:relative;transition:background .2s;margin:0;flex:none}
.toggle input::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.25);transition:transform .2s}
.toggle input:checked{background:var(--ok)}
.toggle input:checked::after{transform:translateX(20px)}

/* paper */
.score-hero{display:flex;align-items:center;gap:18px;padding:18px}
.ring{width:108px;height:108px;flex:none}
.counts{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;flex:1;font-size:14px;color:var(--ink-2)}
.counts b{font-size:19px;color:var(--ink);margin-right:5px}
.counts .c-ok b{color:var(--ok)}.counts .c-bad b{color:var(--bad)}.counts .c-warn b{color:var(--warn)}
.imgwrap{padding:8px;border-radius:24px}
.imgwrap canvas{display:block;width:100%;height:auto;border-radius:18px;background:#fff}
.qgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;padding:12px}
.qc{display:flex;flex-direction:column;align-items:center;padding:7px 0 6px;border-radius:16px;font:600 11.5px var(--mono);background:var(--mute-soft);color:var(--mute);border:1.5px solid transparent}
.qc b{font:750 17px var(--f)}
.qc.correct{background:var(--ok-soft);color:var(--ok)}
.qc.wrong{background:var(--bad-soft);color:var(--bad)}
.qc.review{background:var(--warn-soft);color:var(--warn);border-color:var(--warn)}
.qc.manual b::after{content:"•";font-size:12px;vertical-align:super;margin-left:1px}
.seg.mini{position:static;margin:0;padding:3px}.seg.mini button{min-height:32px;padding:0 12px;font-size:13.5px}
.atab{width:100%;border-collapse:collapse;font-size:15px}
.atab th{font-size:12px;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);text-align:left;padding:12px 12px 6px}
.atab td{padding:8px 12px;border-top:1px solid var(--stroke-2)}
.atab tr[data-act]{cursor:pointer}.atab tr[data-act]:active{background:var(--glass-3)}
.atab td:first-child{font:600 14px var(--mono);color:var(--ink-2);width:3.5em}
.atab .l{font-weight:750;width:4.5em}.atab .r{text-align:right}
.atab tr.review{background:var(--warn-soft)}
.fixbar{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:22px;background:var(--warn-soft);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent);margin-bottom:12px;color:var(--ink)}
.fixbar .ic{color:var(--warn)}

/* sheets & overlays */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(6,10,22,.38);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fade .18s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:91;max-width:480px;margin:0 auto;border-radius:30px 30px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 18px);max-height:92vh;overflow:auto;animation:up .24s cubic-bezier(.2,.8,.2,1);background:var(--glass-2);border:1px solid var(--stroke);box-shadow:var(--hi),0 -10px 40px rgba(0,0,0,.2);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--ink-3);opacity:.5;margin:0 auto 12px}
.sheet h2{font-size:21px;font-weight:750;letter-spacing:-.01em;margin:4px 4px 6px}
.sheet .opts{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:16px 0 10px}
.sheet .opt{aspect-ratio:1;border-radius:50%;font-size:22px;font-weight:750;background:var(--glass);border:2px solid var(--stroke-2);box-shadow:var(--hi)}
.sheet .opt.cand{border-color:var(--bad);color:var(--bad)}
.sheet .opt.on{background:var(--ink);color:var(--bg)}
.menu{display:flex;flex-direction:column;padding:4px}
.menu button{display:flex;align-items:center;gap:14px;padding:15px 12px;border-radius:16px;font-weight:600;font-size:16.5px;text-align:left}
.menu button:active{background:var(--glass-3)}
.menu .danger{color:var(--bad)}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fade{from{opacity:0}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;font-size:15px;margin:10px 4px}
.kv dt{color:var(--ink-2)}.kv dd{margin:0;font-weight:650}

.toasts{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 10px);z-index:200;display:flex;flex-direction:column;gap:8px;width:min(448px,calc(100% - 32px))}
.login{min-height:calc(100vh - 140px);display:grid;place-items:center;padding:24px 0}
.login .card{width:100%;max-width:400px;padding:26px 20px 20px}
.note-bad,.note-warn{display:flex;gap:8px;align-items:flex-start;font-size:14px;font-weight:600;border-radius:14px;padding:10px 12px;margin-bottom:14px}
.note-bad{color:var(--bad);background:var(--bad-soft)}.note-warn{color:var(--warn);background:var(--warn-soft)}
.note-bad .ic,.note-warn .ic{flex:none;margin-top:1px}
.toast{display:flex;align-items:center;gap:10px;padding:13px 16px;border-radius:20px;font-size:15px;font-weight:550;animation:fade .2s}
.toast .grow{flex:1}
.toast button{color:var(--primary);font-weight:750}

.viewer{position:fixed;inset:0;z-index:120;background:#05070d;display:flex;flex-direction:column}
.viewer .vb{display:flex;justify-content:flex-end;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 10px}
.viewer .body{flex:1;overflow:auto;touch-action:pan-x pan-y}
.viewer img{width:100%;height:auto;display:block}
.viewer.zoom img{width:220%}
.viewer .iconbtn{color:#fff;background:rgba(255,255,255,.14)}

/* camera */
[hidden]{display:none!important}   /* a display rule must never un-hide it: the camera's result layer covers the buttons */
.cam{position:fixed;inset:0;z-index:150;background:#000;color:#fff;display:flex;flex-direction:column}
.cam::after,.viewer::after{content:"";position:absolute;left:0;right:0;top:100%;height:50vh;background:inherit}   /* keep the black going behind Safari's bottom toolbar */
.cam video,.cam canvas.ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
/* guide brackets while no sheet is found; the live outline takes over once one is */
.cam .frame{position:absolute;left:50%;top:46%;width:min(80vw,calc(62vh * .707));aspect-ratio:1/1.414;transform:translate(-50%,-50%);transition:opacity .3s;pointer-events:none;animation:breathe 2.2s ease-in-out infinite}
.cam .frame i{position:absolute;width:38px;height:38px;border:4px solid rgba(255,255,255,.92);filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}
.cam .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-top-left-radius:20px}
.cam .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-top-right-radius:20px}
.cam .frame i:nth-child(3){right:0;bottom:0;border-left:0;border-top:0;border-bottom-right-radius:20px}
.cam .frame i:nth-child(4){left:0;bottom:0;border-right:0;border-top:0;border-bottom-left-radius:20px}
.cam .frame.found{opacity:0;animation:none}
@keyframes breathe{50%{transform:translate(-50%,-50%) scale(.965)}}
.cam .top{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;display:flex;justify-content:space-between;align-items:center}
.cam .msg{position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top,0px) + 70px);padding:10px 18px;border-radius:999px;font-weight:650;font-size:15px;white-space:nowrap;background:rgba(0,0,0,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2)}
.cam .msg.good{background:rgba(20,146,74,.85)}
.cam .msg{transition:opacity .2s,background .2s}
.cam[data-phase="result"] .msg,.cam[data-phase="result"] .bottom,.cam[data-phase="reading"] .bottom{opacity:0;pointer-events:none}
.cam .bottom{transition:opacity .2s}
.cam .bottom{position:absolute;left:0;right:0;bottom:0;padding:18px 22px calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;align-items:center;justify-content:space-between}
.cam .cbtn{min-width:64px;height:44px;border-radius:999px;padding:0 14px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.22);color:#fff;font-weight:650;display:flex;align-items:center;justify-content:center;gap:6px}
.cam .cbtn.on{background:#fff;color:#000}
.cam .shutter{width:78px;height:78px;border-radius:50%;border:5px solid #fff;background:rgba(255,255,255,.25)}
.cam .shutter:active{background:#fff}
.cam .count{padding:8px 14px;border-radius:999px;background:rgba(0,0,0,.45);font-size:14px;font-weight:650;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.2)}
/* result pop-up */
.cam .res{position:absolute;inset:0;z-index:5;display:grid;place-items:center;padding:20px;background:rgba(0,0,0,0);-webkit-backdrop-filter:blur(0);backdrop-filter:blur(0);transition:background .3s,backdrop-filter .3s,-webkit-backdrop-filter .3s}
.cam .res.in{background:rgba(0,0,0,.42);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.cam .res .card{width:min(100%,360px);padding:22px 20px 16px;border-radius:32px;text-align:center;color:var(--ink);background:var(--glass-2);border:1px solid var(--stroke);box-shadow:var(--hi),0 30px 60px -12px rgba(0,0,0,.55);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);transform:translateY(24px) scale(.86);opacity:0;transition:transform .5s cubic-bezier(.2,1.4,.4,1),opacity .25s}
.cam .res.in .card{transform:none;opacity:1}
.cam .res .who{font-size:19px;font-weight:750;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cam .res .sub2{font-size:14px;color:var(--ink-2);margin-top:2px}
.cam .res .dial{position:relative;width:200px;height:200px;margin:14px auto 10px}
.cam .res .dial svg{width:100%;height:100%;transform:rotate(-90deg)}
.cam .res .dial circle{fill:none;stroke-width:14}
.cam .res .dial .trk{stroke:var(--mute-soft)}
.cam .res .dial .arc{stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.25,.9,.3,1) .15s}
.cam .res .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cam .res .mid b{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1}
.cam .res .mid i{width:84px;height:3px;border-radius:3px;background:var(--ink-3);opacity:.55;margin:8px 0 6px}
.cam .res .mid span{font-size:17px;color:var(--ink-2);font-weight:650}
.cam .res .tally{display:flex;justify-content:center;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--ink-2);margin-bottom:12px}
.cam .res .tally b{font-size:18px;color:var(--ink);margin-right:4px}
.cam .res .tally .ok b{color:var(--ok)}.cam .res .tally .bad b{color:var(--bad)}.cam .res .tally .warn b{color:var(--warn)}
.cam .res .note{display:flex;align-items:center;gap:8px;justify-content:center;font-size:14px;font-weight:600;color:var(--warn);background:var(--warn-soft);border-radius:14px;padding:9px 12px;margin-bottom:12px;text-align:left}
.cam .res .badge{width:72px;height:72px;border-radius:50%;display:grid;place-items:center;margin:6px auto 12px;background:var(--bad-soft);color:var(--bad)}
.cam .res .badge .ic{width:36px;height:36px}
.cam .res h3{font-size:21px;font-weight:750}
.cam .res p{color:var(--ink-2);font-size:15px;margin:6px 0 16px}
.cam .res .btn.primary{width:100%;min-height:58px;font-size:18px}
.cam .res .link{display:block;margin:6px auto 0}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.flash.go{animation:flash .35s}
@keyframes flash{0%{opacity:.8}100%{opacity:0}}

.spinner{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--primary-soft);border-top-color:var(--primary);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:36px 22px}
.empty .art{width:84px;height:84px;margin:0 auto 14px;color:var(--primary)}
.empty h2{font-size:22px;font-weight:750;margin-bottom:6px}
.empty p{color:var(--ink-2)}
.search{position:relative}
.search .ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.search input{padding-left:44px;border-radius:999px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.brand-mark{width:56px;height:28px;color:var(--primary);flex:none}
.steps{margin:14px 6px 0;padding-left:22px;display:flex;flex-direction:column;gap:10px;font-size:15.5px}
.steps li{padding-left:4px}
.kbd{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--glass);vertical-align:middle;color:var(--primary)}

    <ol class="how">${[['plus', 'Create an exam', 'Give it a name and the number of questions.'], ['key', 'Set the answer key', 'Scan one filled sheet, or type the answers.'], ['camera', 'Scan the papers', 'Point at each sheet — the marks show up at once.']].map(([i, t, d], n) => `<li><span class="n">${n + 1}</span><div><b>${t}</b><span>${d}</span></div></li>`).join('')}</ol></div>`}
  <div class="fab"><button class="btn primary" data-act="new">${ic('plus')}${exams.length ? 'New exam' : 'Create your first exam'}</button></div>`;
}

/* ---------- new exam ---------- */
// Photo set-up, subject, A–E options, marks and negative marking are hidden for now (planned for later).
// New exams use 4 options (A–D), 1 mark per correct answer and no negative marking. Set to true to show them again.
const NEW_EXAM_EXTRAS = false;
const Q_PRESETS = [25, 30, 40, 50];
function vNew() {
  const f = S.ui.create || (S.ui.create = { name: '', subject: '', numQ: 25, numOpts: 4, marks: 1, negEnabled: false, neg: 0.25, idDigits: 6 });
  const er = S.ui.errors, qCustom = !!f.qCustom || !Q_PRESETS.includes(+f.numQ);
  const step = (k, min, max, st) => `<div class="stepper"><button type="button" data-act="step" data-k="${k}" data-d="${-st}" aria-label="Less">−</button><input class="input num ${er[k] ? 'bad' : ''}" id="f_${k}" data-on="cf" data-k="${k}" type="number" inputmode="decimal" min="${min}" max="${max}" step="${st}" value="${esc(f[k])}"><button type="button" data-act="step" data-k="${k}" data-d="${st}" aria-label="More">+</button></div>`;
  return `<header class="bar"><button class="iconbtn glass" data-act="home" aria-label="Back">${ic('left')}</button><span></span></header>
  <h1 class="title">New exam</h1>
  ${NEW_EXAM_EXTRAS ? `<button class="glass card row" style="width:100%;text-align:left;margin-bottom:14px" data-act="pick" data-input="fileLayout" ${S.ui.layoutBusy ? 'disabled' : ''}>
    <span class="iconbtn" style="background:var(--primary-soft);color:var(--primary)">${S.ui.layoutBusy ? '<span class="spinner"></span>' : ic('camera')}</span>
    <span class="grow"><b>${S.ui.layoutBusy ? 'Reading your sheet…' : 'Set up from a photo'}</b><br><span class="muted" style="font-size:14px">Photograph a blank answer sheet and the questions, options and roll digits fill in.</span></span></button>` : ''}
  <form id="newForm" novalidate class="stack">
    <div class="glass" style="padding:4px 0">
      <div class="field"><label for="f_name">Exam name</label><input class="input ${er.name ? 'bad' : ''}" id="f_name" data-on="cf" data-k="name" value="${esc(f.name)}" placeholder="Type your exam name" autocomplete="off" maxlength="80">${er.name ? `<span class="errtxt">${er.name}</span>` : ''}</div>
      ${NEW_EXAM_EXTRAS ? `<div class="field"><label for="f_subject">Subject <span class="faint">(optional)</span></label><input class="input" id="f_subject" data-on="cf" data-k="subject" value="${esc(f.subject)}" autocomplete="off" maxlength="60"></div>` : ''}
    </div>
    <div class="glass" style="padding:4px 0">
      <div class="field"><span class="flabel" id="qLbl">Questions</span><div class="chips" role="group" aria-labelledby="qLbl">${Q_PRESETS.map(n => `<button type="button" class="chip num" data-act="setQ" data-v="${n}" aria-pressed="${!qCustom && +f.numQ === n}">${n}</button>`).join('')}<button type="button" class="chip" data-act="qCustom" aria-pressed="${qCustom}" aria-label="Custom number of questions">${ic('edit', 'sm')}</button></div>${qCustom ? step('numQ', 1, 100, 1) : ''}${er.numQ ? `<span class="errtxt">${er.numQ}</span>` : ''}</div>
      ${NEW_EXAM_EXTRAS ? `<div class="field"><span class="flabel">Options per question</span><div class="seg glass" style="position:static;margin:0">${[4, 5].map(n => `<button type="button" data-act="setF" data-k="numOpts" data-v="${n}" aria-pressed="${+f.numOpts === n}">A – ${LET[n - 1]}</button>`).join('')}</div></div>
      <div class="field"><label for="f_marks">Marks per correct answer</label>${step('marks', 0.25, 100, 0.25)}${er.marks ? `<span class="errtxt">${er.marks}</span>` : ''}</div>
      <label class="toggle">Negative marking<input type="checkbox" data-on="cf" data-k="negEnabled" ${f.negEnabled ? 'checked' : ''}></label>
      ${f.negEnabled ? `<div class="field"><label for="f_neg">Minus per wrong answer</label>${step('neg', 0, 100, 0.25)}</div>` : ''}` : ''}
      <div class="field"><label for="f_idDigits">Roll number bubbles on the sheet</label><select class="input" id="f_idDigits" data-on="cf" data-k="idDigits">${[0, 3, 4, 5, 6, 7, 8, 9, 10].map(n => `<option value="${n}" ${+f.idDigits === n ? 'selected' : ''}>${n ? n + ' digits' : 'None — I will type names'}</option>`).join('')}</select></div>
    </div>
    <div class="fab"><button class="btn primary" type="submit">Create exam</button></div>
  </form>`;
}

/* ---------- exam ---------- */
function vExam(e) {
  const ps = papersOf(e.id), fix = ps.filter(p => grade(p, e).status !== 'graded').length;
  const tab = S.route.tab || (e.key?.confirmed ? 'scan' : 'key'); S.route.tab = tab;
  const body = tab === 'key' ? tKey(e) : tab === 'scan' ? tScan(e) : tResults(e);
  return `<header class="bar"><button class="iconbtn glass" data-act="home" aria-label="Back">${ic('left')}</button><button class="iconbtn glass" data-act="examMenu" aria-label="More">${ic('more')}</button></header>
  <h1 class="title">${esc(e.name)}<small>${e.numQ} questions · A–${LET[e.numOpts - 1]} · +${fmtNum(e.marks)}${e.negEnabled ? ' / −' + fmtNum(e.neg) : ''}${e.sample ? ' · <span class="tag">Sample</span>' : ''}</small></h1>
  <nav class="seg glass" role="tablist">${[['key', 'Answer key'], ['scan', 'Scan'], ['results', 'Results']].map(([k, l]) => `<button role="tab" aria-selected="${tab === k}" data-act="tab" data-tab="${k}">${k === 'key' && e.key?.confirmed ? ic('check', 'sm') : ''}${l}${k === 'results' && fix ? `<span class="dot num">${fix}</span>` : ''}</button>`).join('')}</nav>
  ${body}`;
}
function tKey(e) {
  const d = S.ui.keyDraft[e.id];
  if (e.key?.confirmed && !d) return `<div class="glass"><div class="row between" style="padding:16px 16px 0"><span class="pill ok"><i></i>Answer key confirmed</span><button class="btn sm" data-act="editKey">${ic('edit', 'sm')}Edit</button></div>
    <div class="key-sum">${e.key.answers.map((a, i) => `<div class="ks"><span class="mono faint">${i + 1}</span><b>${LET[a]}</b></div>`).join('')}</div></div>
    <div class="fab"><button class="btn primary" data-act="tab" data-tab="scan">${ic('camera')}Scan papers</button></div>`;
  if (!d || (!d.typing && !d.img && !d.busy)) {
    return `${d?.error ? `<div class="fixbar">${ic('alert')}<div class="grow"><b>${esc(d.error.title)}</b><br><span class="muted" style="font-size:14px">${esc(d.error.reason)}</span>${d.error.debug ? `<br><button class="link" data-act="keyDebug">See what was found</button>` : ''}</div></div>` : ''}
    <div class="glass hero"><button class="shutter-big" data-act="keyCam" aria-label="Scan answer key">${ic('camera')}</button>
      <h2>Scan the answer key</h2><p>Fill the correct bubbles on one blank sheet and point the camera at it.</p>
      <div class="row wrap" style="justify-content:center;margin-top:6px"><button class="btn sm" data-act="pick" data-input="fileKey">${ic('image', 'sm')}From gallery</button><button class="btn sm" data-act="keyType">${ic('type', 'sm')}Type answers</button></div>
      ${e.sample || !e.key ? `<button class="link" data-act="keySample">Try with a sample key photo</button>` : ''}
    </div>
    ${e.key?.confirmed ? `<div style="text-align:center;margin-top:10px"><button class="link" data-act="cancelKey">Keep the current key</button></div>` : ''}`;
  }
  if (d.busy) return `<div class="glass hero"><span class="spinner" style="width:42px;height:42px;border-width:4px"></span><h2>${esc(d.stage || 'Reading key…')}</h2><div class="bar-p" style="width:70%"><i style="width:${Math.round((d.progress || 0) * 100)}%"></i></div></div>`;
  const filled = d.answers.filter(a => a != null).length, flags = Object.keys(d.flags).length;
  return `${d.img ? `<div class="glass imgwrap" style="margin-bottom:12px" data-act="viewKey"><canvas id="keyCanvas" width="1000" height="1414"></canvas></div>` : ''}
    ${flags ? `<div class="fixbar">${ic('alert')}<div class="grow"><b>${flags} question${flags > 1 ? 's' : ''} need your answer</b><br><span class="muted" style="font-size:14px">They're highlighted below. Tap the right option.</span></div></div>` : d.img ? `<div class="fixbar" style="background:var(--ok-soft);border-color:transparent">${ic('check')}<div class="grow"><b>All ${e.numQ} answers read.</b> <span class="muted" style="font-size:14px">Check a few, then confirm.</span></div></div>` : ''}
    ${!d.img ? `<div class="glass paste"><input class="input mono" id="keyPaste" placeholder="Quick type: ACBDA…" autocomplete="off" autocapitalize="characters" spellcheck="false"><button class="btn sm" data-act="keyPaste">Fill</button></div><div style="height:12px"></div>` : ''}
    <div class="glass keys">${d.answers.map((a, i) => { const fl = d.flags[i]; return `<div class="krow ${fl ? 'flag' : ''}" id="kr${i}"><span class="n">${i + 1}</span>${Array.from({ length: e.numOpts }, (_, o) => `<button class="ob ${fl?.cand?.includes(o) ? 'cand' : ''}" aria-pressed="${a === o}" aria-label="Q${i + 1} ${LET[o]}" data-act="keySet" data-q="${i}" data-o="${o}">${LET[o]}</button>`).join('')}</div>`; }).join('')}</div>
    <div style="text-align:center;margin-top:10px"><button class="link" data-act="keyRestart">Start over</button></div>
    <div class="fab"><button class="btn primary" data-act="confirmKey" ${filled === e.numQ && !flags ? '' : 'disabled'}>${ic('check')}Confirm key · ${filled}/${e.numQ}</button></div>`;
}
function tScan(e) {
  if (!e.key?.confirmed) return `<div class="glass empty">${ic('key', 'lg')}<h2 style="margin-top:10px">Answer key first</h2><p>Papers are marked against the key.</p><button class="btn primary" style="margin-top:16px" data-act="tab" data-tab="key">Set answer key</button></div>`;
  const q = S.queue.filter(j => j.examId === e.id && j.state !== 'error' && j.state !== 'dup').slice().reverse();
  const done = new Set(q.map(j => j.paperId).filter(Boolean));
  const older = papersOf(e.id).filter(p => !done.has(p.id)).sort((a, b) => b.createdAt - a.createdAt).slice(0, 30);
  const item = j => {
    const th = `<span class="thumb">${j.thumb ? `<img src="${j.thumb}" alt="">` : ic('sheet')}</span>`;
    if (j.state === 'queued' || j.state === 'working') return `<div class="li">${th}<div class="grow"><div class="t">${esc(j.stage || 'Waiting…')}</div><div class="bar-p"><i style="width:${Math.round((j.progress || 0) * 100)}%"></i></div></div></div>`;
    if (j.state === 'error' || j.state === 'dup') return '';   // only papers that were read are listed
    const p = S.papers[j.paperId]; return p && !p.deletedAt ? paperRow(p, e, j.thumb) : '';
  };
  return `<div class="glass hero"><button class="shutter-big" data-act="scanCam" aria-label="Scan papers">${ic('camera')}</button>
      <h2>Scan papers</h2><p>Point at a sheet and tap the button. You'll see the score right away — tap <b>Next paper</b> for the next one.</p>
      <div class="row wrap" style="justify-content:center;margin-top:6px"><button class="btn sm" data-act="pick" data-input="fileScan">${ic('image', 'sm')}From gallery</button>${e.sample ? `<button class="btn sm" data-act="scanSamples">${ic('wand', 'sm')}Sample papers</button>` : ''}</div></div>
    ${q.length || older.length ? `<p class="sub">Scanned</p><div class="glass list compact">${q.map(item).join('')}${older.map(p => paperRow(p, e)).join('')}</div>` : ''}`;
}
function paperRow(p, e, thumb) {
  const g = grade(p, e), w = who(p, e);
  const note = !g.idOk ? '<span style="color:var(--warn);font-weight:650">Add roll or name</span>' : `${g.correct} right · ${g.wrong} wrong`;
  return `<button class="li" data-act="paper" data-id="${p.id}">${thumb !== undefined ? `<span class="thumb">${thumb ? `<img src="${thumb}" alt="">` : ic('sheet')}</span>` : ''}<div class="grow"><div class="t">${esc(w.title)}${p.sample ? ' <span class="tag">Sample</span>' : ''}</div><div class="s">${note}</div></div><span class="score-pill pill ${g.status === 'graded' ? pctTone(g.pct) : 'warn'} num">${fmtPct(g.pct)}</span></button>`;
}
function tResults(e) {
  const ps = papersOf(e.id);
  if (!ps.length) return `<div class="glass empty">${ic('results', 'lg')}<h2 style="margin-top:10px">No results yet</h2><p>Scanned papers show up here with their scores.</p><button class="btn primary" style="margin-top:16px" data-act="tab" data-tab="scan">${ic('camera')}Scan papers</button></div>`;
  const gs = ps.map(p => grade(p, e)), pcts = gs.map(g => g.pct), fix = gs.filter(g => g.status !== 'graded').length;
  const q = S.ui.q.trim().toLowerCase();
  const rows = ps.filter(p => !q || (who(p, e).roll + ' ' + who(p, e).name).toLowerCase().includes(q)).sort((a, b) => { const ga = grade(a, e), gb = grade(b, e); return (ga.status === 'graded') - (gb.status === 'graded') || (a.student?.roll || '~').localeCompare(b.student?.roll || '~'); });
  return `<div class="glass card" style="display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px;margin-bottom:12px">
      <div><div class="big-num num">${fmtPct(mean(pcts))}</div><div class="faint" style="font-size:13px">average</div></div>
      <div><div class="big-num num">${ps.length}</div><div class="faint" style="font-size:13px">papers</div></div>
      <div><div class="big-num num" style="color:${fix ? 'var(--warn)' : 'var(--ok)'}">${fix}</div><div class="faint" style="font-size:13px">need roll/name</div></div></div>
    ${ps.length > 6 ? `<div class="search" style="margin-bottom:12px">${ic('search')}<input class="input glass" id="rq" type="search" placeholder="Search roll or name" value="${esc(S.ui.q)}" data-on="rq" autocomplete="off"></div>` : ''}
    <div class="glass list" id="resList">${rows.map(p => paperRow(p, e)).join('') || '<p class="muted" style="padding:14px">No match.</p>'}</div>
    <div class="fab"><button class="btn primary" data-act="exportMenu">${ic('share')}Share results</button></div>`;
}

/* ---------- paper ---------- */
function vPaper(e, p) {
  const g = grade(p, e), w = who(p, e), C = 2 * Math.PI * 44, frac = clamp(g.pct, 0, 100) / 100;
  const tone = g.status !== 'graded' ? 'var(--warn)' : g.pct >= 80 ? 'var(--ok)' : g.pct >= 50 ? 'var(--primary)' : 'var(--bad)';
  const wn = wrongNote(g);
  const partial = g.rows.filter(r => r.partial).length, pv = store.get('bm.paperView', 'grid');
  return `<header class="bar"><button class="iconbtn glass" data-act="back" aria-label="Back">${ic('left')}</button><button class="iconbtn glass" data-act="paperMenu" aria-label="More">${ic('more')}</button></header>
  <h1 class="title">${esc(w.title)}<small>${w.roll ? 'Roll <span class="mono">' + esc(w.roll) + '</span> · ' : ''}${esc(e.name)}</small></h1>
  <div class="row" style="margin:0 0 12px"><button class="btn soft" data-act="rescan">${ic('camera', 'sm')}Scan this paper again</button></div>
  ${wn ? `<div class="note-warn">${ic('alert', 'sm')}<span>${wn} — counted as wrong. Tap a question to correct it if the scan was wrong.</span></div>` : ''}
  ${!g.idOk || (e.idDigits && p.student?.state !== 'detected') ? `<div class="glass" style="padding:4px 0;margin-bottom:12px">
    <div class="field"><label for="rollIn">Roll number${!g.idOk ? ' <span style="color:var(--warn)">· needed</span>' : ''}</label><input class="input mono" id="rollIn" value="${esc(p.student?.roll || '')}" data-on="roll" inputmode="numeric" placeholder="${p.student?.state === 'unclear' ? 'Unclear on sheet' : 'Type roll number'}" autocomplete="off"></div>
    <div class="field"><label for="nameIn">Name</label><input class="input" id="nameIn" value="${esc(p.student?.name || '')}" data-on="name" placeholder="Optional" autocomplete="off"></div></div>` : ''}
  <div class="glass score-hero">
    <svg class="ring" viewBox="0 0 108 108" role="img" aria-label="${fmtPct(g.pct)}"><circle cx="54" cy="54" r="44" fill="none" stroke="var(--glass-3)" stroke-width="11"/><circle cx="54" cy="54" r="44" fill="none" stroke="${tone}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${C * frac} ${C}" transform="rotate(-90 54 54)"/><text x="54" y="52" text-anchor="middle" font-size="22" font-weight="750" fill="var(--ink)">${fmtPct(g.pct)}</text><text x="54" y="72" text-anchor="middle" font-size="12.5" fill="var(--ink-2)">${fmtNum(g.score)} / ${fmtNum(g.total)}</text></svg>
    <div class="counts"><div class="c-ok"><b class="num">${g.correct}</b>right</div><div class="c-bad"><b class="num">${g.wrong}</b>wrong</div></div>
  </div>
  ${p.det?.meta?.otherExam ? `<div class="note-warn">${ic('alert', 'sm')}<span>This sheet was printed for a different exam. Check that it belongs to “${esc(e.name)}”.</span></div>` : ''}
  <div class="row between" style="margin:22px 6px 10px"><p class="sub" style="margin:0">Answers</p><div class="seg glass mini" role="group" aria-label="Show answers as">${[['grid', 'Grid'], ['list', 'Table']].map(([k, l]) => `<button data-act="paperView" data-v="${k}" aria-pressed="${pv === k}">${l}</button>`).join('')}</div></div>
  <div class="glass">${pv === 'list' ? answerTable(g) : `<div class="qgrid">${g.rows.map(r => `<button class="qc ${r.out} ${r.manual ? 'manual' : ''}" data-act="q" data-q="${r.i}" aria-label="Question ${r.q} ${OUT[r.out]}">${r.q}<b>${r.ans != null ? LET[r.ans] : '–'}</b></button>`).join('')}</div>`}
  ${partial ? `<p class="faint" style="font-size:13px;padding:0 16px 14px">${partial} answer${partial > 1 ? 's were' : ' was'} only partly filled and ${partial > 1 ? 'were' : 'was'} still read.</p>` : ''}</div>
  <p class="sub">Scanned sheet</p>
  <div class="glass imgwrap" data-act="viewPaper"><canvas id="paperCanvas" width="1000" height="1414" aria-label="Scanned sheet with marks"></canvas></div>`;
}

// Question | Student | Key | Result, with the reason for every wrong question
function answerTable(g) {
  const res = r => r.out === 'correct' ? `<span class="pill ok">${ic('check', 'sm')}Correct</span>` : `<span class="pill bad">${ic('x', 'sm')}Wrong${r.reason ? ' · ' + r.reason : ''}</span>`;
  const stu = r => r.ans != null ? LET[r.ans] + (r.manual ? '•' : '') : r.st === 'blank' ? '—' : (r.cand.map(o => LET[o]).join(' / ') || '?');
  return `<table class="atab"><thead><tr><th scope="col">Q</th><th scope="col">Student</th><th scope="col">Key</th><th scope="col" class="r">Result</th></tr></thead><tbody>${g.rows.map(r => `<tr class="${r.out}" data-act="q" data-q="${r.i}"><td>${r.q}</td><td class="l">${stu(r)}</td><td class="l">${r.k != null ? LET[r.k] : '–'}</td><td class="r">${res(r)}</td></tr>`).join('')}</tbody></table>`;
}

/* ---------- sheets (bottom panels) ---------- */
function openSheet(html) { $('#layer').innerHTML = `<div class="scrim" data-act="closeSheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`; }
function closeSheet() { if (cam) stopCam(); $('#layer').innerHTML = ''; }
function qSheet(e, p, i) {
  const g = grade(p, e), r = g.rows[i], rev = r.st !== 'answered' && !r.manual;
  const det = r.why === 'glare' && rev ? 'Glare on the photo at this row — check the paper' : r.why === 'grid' && rev ? 'Row position unsure — check the paper' : r.blurry && rev ? 'Photo unclear at this row — check the paper' : r.st === 'multiple' || (r.st === 'uncertain' && r.cand.length >= 2) ? r.cand.map(o => LET[o]).join(' and ') + ' (two marks)' : r.st === 'uncertain' ? (r.cand.length ? r.cand.map(o => LET[o]).join(' or ') + ' (unclear)' : 'unclear') : r.det != null && r.st === 'answered' ? LET[r.det] + (r.partial ? ' (partly filled)' : '') : 'Nothing marked';
  openSheet(`<div class="row between"><h2>Question ${r.q}</h2><span class="pill ${r.out === 'correct' ? 'ok' : r.out === 'wrong' ? 'bad' : ''}"><i></i>${OUT[r.out]}${r.reason ? ' · ' + r.reason : ''}</span></div>
    <dl class="kv"><dt>Correct answer</dt><dd>${r.k != null ? LET[r.k] : '–'}</dd><dt>On the sheet</dt><dd>${esc(det)}</dd><dt>Confidence</dt><dd class="num">${Math.round((r.conf || 0) * 100)}%</dd></dl>
    <p class="muted" style="font-size:14px;margin:0 4px">${rev ? 'Pick what the student meant:' : 'Change the answer if it was read wrong:'}</p>
    <div class="opts" style="grid-template-columns:repeat(${e.numOpts},1fr)">${Array.from({ length: e.numOpts }, (_, o) => `<button class="opt ${rev && r.cand.includes(o) ? 'cand' : ''} ${r.ans === o ? 'on' : ''}" data-act="setAns" data-q="${i}" data-o="${o}">${LET[o]}</button>`).join('')}</div>
    <div class="row" style="gap:10px"><button class="btn block" data-act="setAns" data-q="${i}" data-o="-1">No answer</button>${r.manual ? `<button class="btn block" data-act="setAns" data-q="${i}" data-o="reset">${ic('undo', 'sm')}Undo</button>` : ''}</div>`);
}
// Mark strictness, question order and the sample-exam switch are hidden for now; the defaults apply. Set to true to show them.
const SETTINGS_EXTRAS = false;
function settingsSheet() {
  const st = S.settings, strict = st.minConf >= 0.92 ? 'strict' : st.minConf <= 0.78 ? 'relaxed' : 'normal';
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.matchMedia('(display-mode: standalone)').matches;

/* ---------- canvas overlays ---------- */
function tokens() { const cs = getComputedStyle(document.documentElement); const g = n => cs.getPropertyValue(n).trim(); return { ok: g('--ok'), bad: g('--bad'), warn: g('--warn'), mute: g('--mute'), primary: g('--primary') }; }

function loadImg(src) { if (imgCache[src]) return Promise.resolve(imgCache[src]); return new Promise((res, rej) => { const im = new Image(); im.onload = () => { imgCache[src] = im; res(im); }; im.onerror = rej; im.src = src; }); }

}

  return loadImg(src).then(im => {
    if (!document.body.contains(cv)) return;

    const T = tokens(), lw = Math.max(3, G.w / 260);
    G.qs.forEach((q, i) => {
      if (i >= e.numQ) return;
      const st = styleFor(i), color = T[st.col] || T.mute;
      q.forEach(([X, Y], o) => {
        if (st.o.includes(o)) { g.lineWidth = lw; g.strokeStyle = color; g.beginPath(); g.arc(X, Y, R, 0, 7); g.stroke(); }
        if (st.key === o && !st.o.includes(o) && st.col === 'bad') { g.lineWidth = lw * 0.7; g.setLineDash([5, 4]); g.strokeStyle = T.ok; g.beginPath(); g.arc(X, Y, R, 0, 7); g.stroke(); g.setLineDash([]); }
      });

      if (st.blank) { const x0 = q[0][0] - R - 6, x1 = q[q.length - 1][0] + R + 6, cy = mean(q.map(t => t[1])); g.fillStyle = T.bad; g.globalAlpha = .14; g.fillRect(x0, cy - R - 2, x1 - x0, 2 * R + 4); g.globalAlpha = .85; g.lineWidth = lw; g.strokeStyle = T.bad; g.beginPath(); g.moveTo(x0, cy); g.lineTo(x1, cy); g.stroke(); g.globalAlpha = 1; }

}
function afterRender() {
  const r = S.route;

  if (kc) { const e = S.exams[r.id], d = S.ui.keyDraft[e.id]; drawOverlay(kc, d.img, e, d.det, i => { const a = d.answers[i]; return d.flags[i] ? { col: 'warn', o: d.flags[i].cand } : { col: a != null ? 'primary' : 'mute', o: a != null ? [a] : [] }; }); }
  const pc = $('#paperCanvas');

/* ============================================================
   Processing
   ============================================================ */
async function fileToCanvas(file, maxDim = 2000) {
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch { bmp = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = URL.createObjectURL(file); }); }
  return OMR.scaleCanvas(bmp, maxDim);
}

}
const toJpeg = (cv, maxDim, q) => OMR.scaleCanvas(cv, maxDim).toDataURL('image/jpeg', q);
/* The sheet reader runs in a Web Worker (omr-worker.js) so the screen and the camera preview stay smooth while a
   sheet is read. Browsers without OffscreenCanvas in workers (older iPhones) read on the main thread instead. */
const Reader = (() => {
  let w = null, seq = 0; const pend = new Map();
  const local = {
    async read(input, exam, cfg, onStage, images = {}, onThumb) {
      const t0 = performance.now();
      let src; try { src = input instanceof HTMLCanvasElement ? input : await fileToCanvas(input); } catch { return { ok: false, code: 'decode', title: OMR.FAIL.decode[0], reason: OMR.FAIL.decode[1] }; }
      const t1 = performance.now(), imgs = {};
      if (images.thumb) { imgs.thumb = toJpeg(src, ...images.thumb); onThumb?.(imgs.thumb); }
      const res = await OMR.process(src, exam, cfg, onStage), t2 = performance.now();
      if (res.ok) {
        if (images.orig) { imgs.orig = toJpeg(src, ...images.orig); if (images.origFallback && imgs.orig.length > 400000) imgs.orig = toJpeg(src, ...images.origFallback); }
        if (images.proc) imgs.proc = toJpeg(OMR.toCanvas(res.N, res.w, res.h), ...images.proc);
        delete res.N; res.meta.timing = { open: Math.round(t1 - t0), read: Math.round(t2 - t1), images: Math.round(performance.now() - t2), where: 'main' };
      }
      return { ...res, imgs };
    },
    async layout(input, cfg) { return OMR.detectLayout(await fileToCanvas(input), cfg); },
    async check(frame, cfg) { return OMR.quickCheck(frame, cfg); },
  };
  const start = () => {
    try {
      if (typeof OffscreenCanvas !== 'undefined' && 'convertToBlob' in OffscreenCanvas.prototype && typeof Worker !== 'undefined' && !window.claude) {
        w = new Worker('omr-worker.js');
        w.onmessage = ({ data: m }) => {
          const p = pend.get(m.id); if (!p) return;
          if (m.stage) { p.onStage?.(m.stage, m.progress); return; }
          if (m.thumb) { p.onThumb?.(m.thumb); return; }
          pend.delete(m.id); m.ok ? p.res(m.result) : p.rej(new Error(m.error));
        };

      }
    } catch { w = null; }

  // a fresh reader for the next one.

    if (input.type && !/^image\//.test(input.type)) return { ok: false, code: 'decode', title: 'Not a photo', reason: 'Pick a JPG or PNG photo of the answer sheet.' };
    if (input.size > 40e6) return { ok: false, code: 'decode', title: 'Photo is too large', reason: 'Use a photo under 40 MB — a normal phone photo is 2–6 MB.' };
    return null;

    get inWorker() { return !!w; },
    read: (input, exam, cfg, onStage, images, onThumb) => { const no = refuse(input); if (no) return Promise.resolve(no); return call('read', { input, exam: plain(exam), cfg: plain(cfg), images }, { onStage, onThumb }, input instanceof ImageBitmap ? [input] : [], () => local.read(input, exam, cfg, onStage, images, onThumb), 60000); },
    layout: (input, cfg) => call('layout', { input, cfg: plain(cfg) }, {}, [], () => local.layout(input, cfg)),
    // the camera sends a frame only when the previous one is finished, so checks never pile up
    check: async (video, cfg) => {
      if (!w) return local.check(video, cfg);
      const bmp = await createImageBitmap(video, { resizeWidth: 640, resizeHeight: Math.round(640 * video.videoHeight / video.videoWidth), resizeQuality: 'medium' }).catch(() => null);
      if (!bmp) return local.check(video, cfg);

})();
function paintQueue() { if (S.route.view === 'exam' && S.route.tab === 'scan') scheduleRender(); }

  if (j.file) { j.hash = await hashFile(j.file); const dup = !j.force && papersOf(e.id).find(p => p.hash === j.hash); if (dup) { j.state = 'dup'; j.dupOf = who(dup, e).title; return; } }
  const input = j.file || j.bitmap; j.bitmap = null;
  const res = await Reader.read(input, e, S.settings, stage, { thumb: [160, 0.6], orig: [1400, 0.72], origFallback: [1100, 0.62], proc: [900, 0.72] }, t => { j.thumb = t; paintQueue(); });

    student: { roll: res.id.roll, name: '', state: res.id.state === 'none' ? 'missing' : res.id.state },

}

  const jobs = [], rs = S.ui.rescan;   // stays set until a scan has replaced the paper, so a photo that cannot be read can be tried again
  const replaces = rs && rs.examId === examId && !extra.sample && Date.now() - rs.t < 6e5 && S.papers[rs.paperId] ? rs.paperId : null;

// After one photo from the phone's camera app or the gallery: the same score pop-up as the live camera had, with "Next paper"
// (opens the camera app or gallery again) and "See answers". Shown while the sheet is read, then with the result.
function scorePopup(j, e, inputId) {
  const layer = $('#layer'); let gone = false;
  const done = () => { gone = true; layer.innerHTML = ''; };
  const shell = inner => { layer.innerHTML = `<div class="cam" data-phase="result" style="background:transparent"><div class="res in" id="cr" style="background:rgba(0,0,0,.5)"><div class="card" style="transform:none;opacity:1">${inner}</div></div></div>`; };
  const reading = () => shell(`<h3>Reading answers…</h3><p id="cstage">${esc(j.stage || 'Opening the photo')}…</p>`);
  reading();
  const poll = setInterval(() => { if (gone || j.state === 'done' || j.state === 'error') return clearInterval(poll); const el = $('#cstage'); if (el && j.stage) el.textContent = j.stage + '…'; }, 250);
  j.onDone = jb => {
    clearInterval(poll); if (gone) return;
    const next = () => { done(); $('#' + inputId).click(); };
    if (jb.state === 'done' && S.papers[jb.paperId]) {
      const p = S.papers[jb.paperId], gr = grade(p, e), w = who(p, e), C = 2 * Math.PI * 88, frac = clamp(gr.pct, 0, 100) / 100;
      const tone = gr.status !== 'graded' ? 'var(--warn)' : gr.pct >= 80 ? 'var(--ok)' : gr.pct >= 50 ? 'var(--primary)' : 'var(--bad)';

/* ============================================================
   Sign-in — the server gives each paying user a signed pass; the app checks it here, offline, and
   stops working when it runs out (at most 30 days without going online, or when the paid time ends).
   Every time the app is online the pass is renewed, or withdrawn if the account was switched off.
   ============================================================ */
const Auth = {
  key: null,
  get() { return store.get('bm.auth', null); },
  device() { let d = store.get('bm.device', ''); if (!d) { d = crypto.randomUUID ? crypto.randomUUID() : uid('d') + uid(); store.set('bm.device', d); } return d; },
  bytes(s) { const b = atob(s.replace(/-/g, '+').replace(/_/g, '/') + '==='.slice((s.length + 3) % 4)); return Uint8Array.from(b, c => c.charCodeAt(0)); },
  // the pass, if it is genuine, unexpired and was given to this phone
  async check() {
    const a = this.get(), cfg = window.MCQ_AUTH;
    if (!a?.token || !cfg?.key || !crypto.subtle) return null;
    try {
      const [body, sig] = a.token.split('.');
      this.key = this.key || await crypto.subtle.importKey('jwk', cfg.key, { name: 'ECDSA', namedCurve: 'P-256' }, false, ['verify']);
      if (!await crypto.subtle.verify({ name: 'ECDSA', hash: 'SHA-256' }, this.key, this.bytes(sig), new TextEncoder().encode(body))) return null;
      const p = JSON.parse(new TextDecoder().decode(this.bytes(body)));

    } catch { return null; }
  },
  async post(url, body) {
    const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body), cache: 'no-store' });
    const d = await r.json().catch(() => ({}));
    return { ...d, ok: r.ok, status: r.status };
  },
  save(d) { store.set('bm.auth', { token: d.token, email: d.email, exp: d.exp }); store.set('bm.authAt', Date.now()); S.auth = { ok: true, email: d.email, exp: d.exp }; },
  async signIn(email, password) {
    const d = await this.post('api/login', { email, password, device: this.device(), deviceName: /iphone/i.test(navigator.userAgent) ? 'iPhone' : /ipad/i.test(navigator.userAgent) ? 'iPad' : /android/i.test(navigator.userAgent) ? 'Android phone' : 'Computer' });
    if (d.ok) this.save(d);

  },
  // renew while online; a refusal from the server (switched off, paid time over, signed out) locks the app now
  async renew(force) {
    if (!S.auth?.ok || navigator.onLine === false) return;
    if (!force && Date.now() - store.get('bm.authAt', 0) < 6 * 36e5) return;

  },
};
