/* ============================================================
   Answer keys sent from the question paper maker (../index.html)
   #import=<base64url of {name, subject, marks, sets:[{label, key:[0..3,...]}]}>
   One exam per set; opening the same link twice does not make copies.
   ============================================================ */
function importFromPaper() {
  const m = location.hash.match(/^#import=([A-Za-z0-9_-]+)/); if (!m) return null;
  history.replaceState(null, '', location.pathname + location.search);
  let d; try { d = JSON.parse(new TextDecoder().decode(Auth.bytes(m[1]))); } catch { toast('Could not read the answer key from the question paper.'); return null; }
  if (!d || !Array.isArray(d.sets) || !d.sets.length) return null;
  let first = null, made = 0;
  d.sets.forEach(st => {
    const key = (st.key || []).map(Number).filter(n => n >= 0 && n < 4).slice(0, 100); if (!key.length) return;
    const name = String(d.name || 'Question paper').slice(0, 70) + (d.sets.length > 1 ? ` — Set ${st.label}` : '');
    let h = 0; const sig = name + '|' + key.join(''); for (let i = 0; i < sig.length; i++) h = (h * 31 + sig.charCodeAt(i)) >>> 0;
    const id = 'qp_' + h.toString(36);
    if (!S.exams[id] || S.exams[id].deletedAt) {
      const now = Date.now();
      const e = { id, name, subject: String(d.subject || '').slice(0, 60), numQ: key.length, numOpts: 4, marks: +d.marks > 0 ? +d.marks : 1, negEnabled: false, neg: 0, multiRule: 'review', idDigits: 6,
        createdAt: now, updatedAt: now, roster: {}, audit: [], fromPaper: true,
        key: { answers: key, confirmed: true, version: 1, source: 'paper', confirmedAt: now } };
      S.exams[id] = e; saveExam(e); made++;
      Track.ev('exam_created', { questions: e.numQ, options: 4, roll_digits: 6, negative: false, from_paper: true });
    }
    first = first || id;
  });
  if (first) toast(made ? `Answer key added from your question paper${d.sets.length > 1 ? ` (${d.sets.length} sets)` : ''}. Print the answer sheets, then scan.` : 'This question paper is already here.');
  return d.sets.length === 1 ? first : null;
}

/* ============================================================
   Boot
   ============================================================ */
(async function boot() {
  Track.start(); Track.ev('app_open', { screen_w: screen.width, lang: navigator.language });
  const pass = { e: '', exp: Infinity };   // open mode inside the question paper app: no sign-in
  S.auth = pass ? { ok: true, email: pass.e, exp: pass.exp } : { ok: false, msg: Auth.get() ? 'Your sign-in has run out. Connect to the internet and sign in again.' : '' };
  if (!pass) store.del('bm.auth');
  render();
  if (await DB.open()) {
    const [ex, ps] = await Promise.all([DB.all('exams'), DB.all('papers')]);
    ex.forEach(e => { S.exams[e.id] = e; }); ps.forEach(p => { S.papers[p.id] = p; });
    try { navigator.storage?.persist?.(); } catch {}
  }
  const fromPaper = importFromPaper(); if (fromPaper) S.route = { view: 'exam', id: fromPaper };
  history.pushState(null, '');
  render();
  // the demo exam is built once, on the very first visit; after that it only comes back from Settings
  if (!fromPaper && SAMPLE_EXAM && !S.prefs.hideSample && !store.get('bm.sampleShown', false) && !examList().some(e => !e.sample)) { store.set('bm.sampleShown', true); buildSample(); }
  if (!window.claude && /iphone|ipad|ipod/i.test(navigator.userAgent) && !Track.standalone()) setTimeout(() => { if (S.auth.ok && !$('#layer').innerHTML) installSheet(true); }, 2500);
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost') && !window.claude) {
    // when a new version takes over, reload once (not while the camera is open) so the page and its code match
    const had = !!navigator.serviceWorker.controller; let reloaded = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (had && !reloaded && !cam) { reloaded = true; location.reload(); } });
    navigator.serviceWorker.register('sw.js').then(r => r.update()).catch(() => {});
  }
})();

<script>
/* ---------------- interface language: বাংলা / English ----------------
   The interface text is translated in place (the question paper itself keeps the language of its subject).
   PAIRS: exact [English, বাংলা]. PATS: [regex on the original text, english(...groups), bangla(...groups)].
   Every node remembers its original text, so switching back and forth never compounds. */
const I18N = (() => {
  const BNd = '০১২৩৪৫৬৭৮৯';
  const toBn = s => String(s).replace(/[0-9]/g, d => BNd[d]);
  const toEn = s => String(s).replace(/[০-৯]/g, d => BNd.indexOf(d));
  const en2bn = new Map(), bn2en = new Map();
  const norm = t => t.replace(/\s+/g, ' ').trim();
  function add(pairs){ pairs.forEach(([e, b]) => { en2bn.set(norm(e), b); bn2en.set(norm(b), e); }); }
  const pats = [];
  function addPats(list){ pats.push(...list); }
  let lang = 'bn'; try{ lang = localStorage.getItem('proshno-ui-lang') || 'bn'; }catch(e){}
  function tr(orig){
    const t = norm(orig); if(!t) return orig;
    const lead = orig.match(/^\s*/)[0], trail = orig.match(/\s*$/)[0];
    let out = null;
    if(lang === 'bn'){ if(en2bn.has(t)) out = en2bn.get(t); }
    else { if(bn2en.has(t)) out = bn2en.get(t); }
    if(out === null) for(const [re, fe, fb] of pats){ const m = t.match(re); if(m){ out = (lang === 'bn' ? fb : fe)(...m.slice(1)); break; } }
    if(out === null && /^[\d০-৯\s+=×.,%°\-–:/]+$/.test(t)) out = lang === 'bn' ? toBn(t) : toEn(t);
    return out === null ? orig : lead + out + trail;
  }
  const SKIP = 'script,style,iframe,textarea,.exporthost,#fontPrev,[data-noi18n]';
  const seen = new WeakMap();   // text node -> {o: original, s: shown}
  const aseen = new WeakMap();  // element -> {attr: {o, s}}
  const ATTRS = ['placeholder', 'title', 'aria-label', 'label'];
  function skip(el){ if(!el) return true; if(el.closest(SKIP)) return true; const pg = el.closest('.page'); return !!(pg && !el.closest('.qtools')); }
  function doText(n){
    if(skip(n.parentElement)) return;
    let r = seen.get(n); const v = n.nodeValue;
    if(!r || v !== r.s){ r = {o: v}; seen.set(n, r); }
    const nv = tr(r.o); r.s = nv; if(nv !== v) n.nodeValue = nv;
  }
  function doEl(el){
    if(skip(el)) return;
    let rec = aseen.get(el); if(!rec){ rec = {}; aseen.set(el, rec); }
    const list = ATTRS.slice(); if(el.tagName === 'INPUT' && el.disabled && el.type === 'text') list.push('value');
    list.forEach(a => { const v = a === 'value' ? el.value : el.getAttribute(a); if(v == null || v === '') return;
      let r = rec[a]; if(!r || v !== r.s) r = rec[a] = {o: v};
      const nv = tr(r.o); r.s = nv; if(nv !== v){ if(a === 'value') el.value = nv; else el.setAttribute(a, nv); } });
  }
  function walk(root){
    if(root.nodeType === 3) return doText(root);
    if(root.nodeType !== 1) return;
    doEl(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT, { acceptNode: n => n.nodeType === 1 && n.matches(SKIP) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
    let n; while((n = w.nextNode())) n.nodeType === 3 ? doText(n) : doEl(n);
  }
  let mo = null, pend = new Set(), raf = 0;
  function flush(){ raf = 0; mo && mo.disconnect(); const list = [...pend]; pend.clear(); list.forEach(n => n.isConnected && walk(n)); observe(); }
  function observe(){ mo.observe(document.body, {childList: true, subtree: true, characterData: true, attributes: true, attributeFilter: ATTRS}); }
  const listeners = [];
  function apply(){
    document.documentElement.lang = lang;
    document.documentElement.dataset.ui = lang;
    mo && mo.disconnect(); walk(document.body); mo && observe();
    document.querySelectorAll('.langsw button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
    listeners.forEach(f => f(lang));
  }
  function set(l){ lang = l === 'en' ? 'en' : 'bn'; try{ localStorage.setItem('proshno-ui-lang', lang); }catch(e){} apply(); }
  function start(){
    mo = new MutationObserver(ms => { ms.forEach(m => { if(m.type === 'characterData') pend.add(m.target); else if(m.type === 'attributes') pend.add(m.target); else m.addedNodes.forEach(n => pend.add(n)); }); flush(); });
    apply();
    document.addEventListener('click', e => { const b = e.target.closest('.langsw button'); if(b) set(b.dataset.lang); });
  }
  return { add, addPats, start, set, get lang(){ return lang; }, tr, toBn, toEn, onChange: f => listeners.push(f), apply };
})();
